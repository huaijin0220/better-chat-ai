name: Validate SKILL.md

on:
  push:
    paths:
      - "SKILL.md"
      - "SKILL.en.md"
  pull_request:
    paths:
      - "SKILL.md"
      - "SKILL.en.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md
        run: python .github/scripts/validate_skill.py