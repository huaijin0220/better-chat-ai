name: Validate Skill

on:
  push:
    paths:
      - "SKILL.md"
      - ".cursor/rules/*.mdc"
      - ".github/copilot-instructions.md"
      - ".windsurf/rules/*.md"
  pull_request:
    paths:
      - "SKILL.md"
      - ".cursor/rules/*.mdc"
      - ".github/copilot-instructions.md"
      - ".windsurf/rules/*.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate
        run: python .github/scripts/validate_skill.py